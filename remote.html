<!doctype html><html lang="en"><meta charset="utf-8"><link rel="icon" type="image/png" href="icons/icon-32.png"><title>HandyCon</title><meta name="description" content="Your hand. Your remote."><link rel="stylesheet" href="style.css"><body><main><div class="preview"><div id="camera-loading" hidden role="status" aria-label="Starting camera"><svg viewBox="0 0 24 24" width="56" height="56" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-opacity=".2" stroke-width="2"/><path d="M12 3a9 9 0 0 1 9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><div id="camera-off" aria-label="Camera off" role="img"><svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l1.5-2h3L16 6h4a1 1 0 0 1 1 1v10M19 20H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h1"/><path d="M14.8 14.8a4 4 0 0 1-5.6-5.6M11 8.1a4 4 0 0 1 4.9 4.9M2 2l20 20"/></svg></div><video autoplay muted playsinline></video><canvas id="landmarks" width="640" height="480" aria-hidden="true"></canvas><span id="shape">Turn on the camera to start.</span></div><div class="control-bar"><div class="playback-controls"><div id="manual-controls"><button data-command="playPause" aria-label="Play">▶</button><button data-command="back" aria-label="Back 5 seconds">↶ 5</button><button data-command="forward" aria-label="Forward 5 seconds">5 ↷</button><button data-command="captions" aria-label="Enable captions">Captions</button><button data-command="fullscreenToggle" aria-label="Enter fullscreen">Fullscreen</button></div><div class="help-wrap"><button class="help-button" type="button" aria-label="Gesture guide" aria-describedby="gesture-help"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7" r=".8" fill="currentColor" stroke="none"/></svg></button><div id="gesture-help" class="help-tooltip" role="tooltip"><div class="help-title">Gestures<span class="hold-badge">Hold 0.25s</span></div><dl class="gesture-list"><dt aria-label="Thumbs up">👍 Thumbs up</dt><dd>Play / pause</dd><dt>☝️ Index</dt><dd>−5 seconds</dd><dt aria-label="V sign">✌️ V sign</dt><dd>+5 seconds</dd><dt aria-label="Okay sign">👌 okay</dt><dd>Captions</dd><dt aria-label="Index and pinky">🤘 Index + pinky</dt><dd>Fullscreen</dd></dl><p class="help-compact-reset">✊ Hold 0.25s to reset</p></div></div></div><div class="utility-controls"><div class="camera-actions"><label class="camera-switch" title="Toggle camera"><input id="camera-toggle" type="checkbox" role="switch" aria-label="Toggle camera"><span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></label></div></div></div><progress max="1" value="0"></progress><div id="command-target" role="status"><span class="target-label">Now controlling</span><span id="target-title">Active YouTube or Netflix tab</span></div><p id="status" role="status"></p></main><script type="module" src="remote.js"></script></body></html>
